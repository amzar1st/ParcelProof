name: ParcelProof verification
on:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'contracts/**', 'tests/**', 'scripts/**', 'build/**', '.github/workflows/**', 'package.json', 'pnpm-lock.yaml', 'vite.config.ts']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Install declared package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract tests
        run: python -m unittest discover -s tests -q
      - name: Frontend checks
        run: node scripts/test-frontend.cjs
      - name: TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Production build
        run: pnpm build
      - name: Install isolated browser tools
        run: npm install --prefix "$RUNNER_TEMP/parcelproof-browser" --package-lock=false playwright@1.58.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/parcelproof-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile browser smoke
        run: PARCELPROOF_BROWSER_PACKAGE_DIR="$RUNNER_TEMP/parcelproof-browser" node scripts/test-browser.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parcelproof-browser-evidence
          path: outputs/
          if-no-files-found: ignore
          retention-days: 30
